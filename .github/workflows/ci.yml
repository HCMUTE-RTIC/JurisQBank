name: CI Pipeline

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  backend-check:
    runs-on: self-hosted
    # Cách này an toàn nhất: Chạy trong Container Python 3.13
    # Server chỉ cần có Docker, không cần cài Python
    container: python:3.13
    defaults:
      run:
        working-directory: ./server
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: Run Linting (Flake8)
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  frontend-check:
    runs-on: self-hosted
    # Chạy trong Container Node 22
    # Server chỉ cần có Docker, không cần cài Node.js
    container: node:22
    defaults:
      run:
        working-directory: ./client
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        # Node container chưa có pnpm, ta cài nhẹ nó
        run: npm install -g pnpm

      - name: Install Dependencies
        run: pnpm install

      - name: Run Linting (ESLint)
        run: pnpm lint

      - name: Build Frontend
        run: pnpm build
